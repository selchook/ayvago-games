<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Ayvago City Preview</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font: 13px/1.35 system-ui, sans-serif; color: #e8e8e8; }
    #view { position: fixed; inset: 0; touch-action: none; }
    #panel { position: fixed; top: 8px; left: 8px; width: 270px; max-height: calc(100% - 16px); overflow: auto; background: rgba(18, 20, 26, 0.86); border: 1px solid #333; border-radius: 10px; padding: 10px 12px; box-sizing: border-box; }
    #panel.hidden > :not(#toggle) { display: none; }
    #panel h1 { font-size: 14px; margin: 0 0 8px; }
    #panel label { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin: 4px 0; }
    #panel input[type=range] { width: 120px; }
    #panel input[type=number] { width: 90px; }
    #panel select, #panel input, #panel button { font: inherit; }
    #panel button { background: #2c3340; color: #eee; border: 1px solid #455; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
    #panel button.on { background: #3d6fd8; }
    .row { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0; }
    .sec { border-top: 1px solid #333; margin-top: 8px; padding-top: 6px; color: #9ab; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
    #stats { position: fixed; bottom: 8px; left: 8px; right: 8px; background: rgba(0,0,0,.6); padding: 4px 8px; border-radius: 6px; font: 12px/1.3 ui-monospace, monospace; pointer-events: none; }
    #mini { position: fixed; top: 8px; right: 8px; width: 240px; height: 240px; border: 1px solid #444; border-radius: 8px; background: #222; }
    #help { position: fixed; bottom: 34px; right: 8px; background: rgba(0,0,0,.55); padding: 6px 8px; border-radius: 6px; font-size: 12px; max-width: 320px; }
    #toggle { float: right; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="panel">
    <button id="toggle" title="hide / show">≡</button>
    <h1>City generator</h1>
    <label>Seed <span><input id="seed" type="number" value="1" /> <button id="rnd" title="random seed">🎲</button></span></label>
    <label>Style <select id="style"></select></label>
    <label>Size (m) <input id="size" type="range" min="800" max="2400" step="100" /> <span id="sizeV"></span></label>
    <label>Look <select id="look"></select></label>
    <div class="sec">District mix</div>
    <div id="mix"></div>
    <div class="row"><button id="gen">Generate</button><button id="resetMix">Reset mix</button></div>
    <div class="sec">Camera</div>
    <div class="row" id="cams"></div>
    <label>Detail radius <input id="near" type="range" min="120" max="900" step="20" value="320" /> <span id="nearV"></span></label>
    <div class="sec">Show</div>
    <div class="row" id="toggles"></div>
    <div class="row"><button id="shots">Screenshot set</button></div>
  </div>
  <canvas id="mini" width="480" height="480"></canvas>
  <div id="help"></div>
  <div id="stats"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
