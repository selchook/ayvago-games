name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # ayvago-games is the studio; ayvago.com (selchook/ayvago) is the platform. These checks keep
  # the two in step: the platform pulls platform/arcade-catalog.ts from main by itself, so it must
  # be current, and the vendored adapter must be the platform's.
  platform-sync:
    runs-on: ubuntu-24.04   # Playwright 1.56 does not support the ubuntu-latest image (26.04) yet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Platform manifests and catalog are up to date
        run: |
          node scripts/gen-platform.mjs --live
          if ! git diff --quiet -- platform public/games; then
            git diff --stat -- platform public/games
            echo "::error::platform/arcade-catalog.ts or public/games/*/ayvago.json is stale. Run 'node scripts/gen-platform.mjs --live' and commit the result."
            exit 1
          fi
      - name: Vendored adapter matches the platform
        run: |
          curl -fsSL https://raw.githubusercontent.com/selchook/ayvago/main/packages/platform-adapter/src/adapter.ts -o "$RUNNER_TEMP/adapter.ts"
          if ! diff -u "$RUNNER_TEMP/adapter.ts" src/core/ayvago/adapter.ts; then
            echo "::error file=src/core/ayvago/adapter.ts::The vendored adapter differs from selchook/ayvago packages/platform-adapter/src/adapter.ts on main. Copy that file here verbatim."
            exit 1
          fi

  # Builds and smoke-tests only the games the change touches; a change to shared code (core,
  # scripts, assets, config) tests every game. Typecheck always covers the whole project.
  build-and-smoke:
    runs-on: ubuntu-24.04   # Playwright 1.56 does not support the ubuntu-latest image (26.04) yet
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Games to test
        id: games
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then base="origin/${{ github.base_ref }}"; else base="${{ github.event.before }}"; fi
          # A new branch or a force push has no usable base: test everything.
          if git cat-file -e "$base^{commit}" 2>/dev/null; then list=$(node scripts/changed-games.mjs "$base"); else list=all; fi
          echo "Games: ${list:-none}"
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - run: npm run typecheck
      - if: steps.games.outputs.list != ''
        run: npx playwright@1.56.1 install --with-deps chromium
      - if: steps.games.outputs.list != ''
        run: npm i --no-save playwright@1.56.1
      - name: Build and smoke-test the changed games
        if: steps.games.outputs.list != ''
        run: |
          if [ "$GAME_LIST" = all ]; then node scripts/test-changed.mjs all --smoke-only; else node scripts/test-changed.mjs --games "$GAME_LIST" --smoke-only; fi
        env:
          # Not GAMES: vite.config.ts reads that one to pick what to build.
          GAME_LIST: ${{ steps.games.outputs.list }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report
          path: reports/
      - uses: actions/upload-artifact@v4
        if: steps.games.outputs.list != ''
        with:
          name: dist
          path: dist/
