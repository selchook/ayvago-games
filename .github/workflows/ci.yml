name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright@1.56.1 install --with-deps chromium
      - run: npm i --no-save playwright@1.56.1
      - run: npm run build
      - run: npm run test:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report
          path: reports/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
